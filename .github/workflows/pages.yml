name: Deploy to GitHub Pages

# Requires Settings > Pages > Build and deployment > Source: GitHub Actions.
# The release gate fails while any displayed evidence, case or claim still awaits
# Thomas's confirmation, so nothing unconfirmed can be published.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install chromium --with-deps

      - name: Release gate (confirmations, data, claims)
        run: npm run qa:release-gate && npm run qa:claims

      - name: Tests
        run: npm run lint && npm run typecheck && npm test

      - name: Build
        run: npm run build

      - name: Pre-deploy checks
        run: npm run check:copy && npm run qa:content && npm run qa:confidential && npm run qa:links && npm run verify && npm run test:e2e && npm run qa:lighthouse

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
